# Pipeline historique conservée pour référence. Gitea Actions prend le relais.
# Désactiver également les déclencheurs éventuellement forcés dans l'interface Azure.
trigger: none
pr: none

pool:
  name: Default
  demands:
    - agent.name -equals VM-DEVOPS

variables:
  IMAGE_NAME: 'factoryhub_image'
  SERVER_USER: 'adminprod'
  SERVER_IP: '192.168.1.104'
  SERVER_PATH: 'C:\Deploy\containers\factoryhub_container'
  CONTAINER_NAME: 'factoryhub_container'
  APP_PORT: '12000'

stages:
  - stage: Build
    displayName: Construire l’image Docker
    jobs:
      - job: Build
        displayName: Build FactoryHub
        steps:
          - script: |
              echo Construction de l'image Docker FactoryHub...
              docker build -t $(IMAGE_NAME):latest -f Dockerfile .
            displayName: Construire l’image Docker

          - script: |
              echo Sauvegarde de l'image Docker...
              docker save $(IMAGE_NAME):latest -o $(IMAGE_NAME).tar
            displayName: Sauvegarder l’image Docker

          - task: PublishBuildArtifacts@1
            displayName: Publier l’image Docker
            inputs:
              pathToPublish: '$(IMAGE_NAME).tar'
              artifactName: 'docker-image'

  - stage: Deploy
    displayName: Déployer sur VM-APP
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: Déploiement SSH
        steps:
          - task: DownloadBuildArtifacts@0
            displayName: Télécharger l’image Docker
            inputs:
              buildType: current
              artifactName: docker-image
              downloadPath: '$(Pipeline.Workspace)'

          - script: |
              echo Préparation du dossier distant...
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "if not exist \"$(SERVER_PATH)\" mkdir \"$(SERVER_PATH)\""
              if errorlevel 1 exit /b 1

              echo Transfert de l'image Docker...
              pscp -batch -pw "$(SSH_PASSWORD)" "$(Pipeline.Workspace)\docker-image\$(IMAGE_NAME).tar" $(SERVER_USER)@$(SERVER_IP):"$(SERVER_PATH)\$(IMAGE_NAME).tar"
              if errorlevel 1 exit /b 1
            displayName: Transférer l’image sur VM-APP

          - script: |
              echo Arrêt de l'ancien conteneur...
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker stop $(CONTAINER_NAME) || exit 0"
            displayName: Arrêter le conteneur existant

          - script: |
              echo Suppression de l'ancien conteneur...
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker rm $(CONTAINER_NAME) || exit 0"
            displayName: Supprimer le conteneur existant

          - script: |
              echo Suppression de l'ancienne image...
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker rmi $(IMAGE_NAME):latest || exit 0"
            displayName: Supprimer l’ancienne image

          - script: |
              echo Chargement de la nouvelle image...
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker load -i \"$(SERVER_PATH)\$(IMAGE_NAME).tar\""
              if errorlevel 1 exit /b 1
            displayName: Charger la nouvelle image

          - script: |
              echo Démarrage de FactoryHub sur le port $(APP_PORT)...
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker run -d --name $(CONTAINER_NAME) --restart unless-stopped -p $(APP_PORT):80 $(IMAGE_NAME):latest"
              if errorlevel 1 exit /b 1
            displayName: Démarrer FactoryHub

          - script: |
              echo Vérification du conteneur...
              timeout /t 8 /nobreak > nul
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker inspect --format=\"{{.State.Health.Status}}\" $(CONTAINER_NAME)"
              if errorlevel 1 exit /b 1
            displayName: Vérifier FactoryHub

